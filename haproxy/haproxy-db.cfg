global
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5000
    option httpchk HEAD /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server postgres-1 postgres-1:5432 maxconn 100 check port 8008
    server postgres-2 postgres-2:5432 maxconn 100 check port 8008
    server postgres-3 postgres-3:5432 maxconn 100 check port 8008

listen replicas
    bind *:5001
    option httpchk HEAD /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server postgres-1 postgres-1:5432 maxconn 100 check port 8008
    server postgres-2 postgres-2:5432 maxconn 100 check port 8008
    server postgres-3 postgres-3:5432 maxconn 100 check port 8008
