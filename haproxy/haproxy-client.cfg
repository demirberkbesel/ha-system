global
    maxconn 100

defaults
    log global
    mode http
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen api
    bind *:8080
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server backend-1 backend-1:8000 check
    server backend-2 backend-2:8000 check
